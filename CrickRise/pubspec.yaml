name: crickrise
description: CrickRise — Your Cricket Career.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.0.0

  # Local storage (offline-first)
  drift: ^2.18.0
  drift_flutter: ^0.2.0
  path_provider: ^2.1.5

  # Supabase (backend sync)
  supabase_flutter: ^2.5.0

  # UI
  google_fonts: ^6.2.1
  cached_network_image: ^3.3.1
  fl_chart: ^0.68.0
  flutter_animate: ^4.5.0
  animations: ^2.0.0
  pinput: ^5.0.1
  lottie: ^3.1.0
  skeletonizer: ^1.4.0

  # Sharing / export
  share_plus: ^9.0.0
  screenshot: ^2.3.0

  # Utils
  uuid: ^4.5.1
  intl: ^0.19.0
  connectivity_plus: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  drift_dev: ^2.18.0
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/
