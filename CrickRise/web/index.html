<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CrickRise — Every Sunday, a story worth sending home">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="CrickRise">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <title>CrickRise</title>
  <link rel="manifest" href="manifest.json">

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #0F0B08;
      overflow: hidden;
    }
    #boot-loader {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(ellipse at 50% 30%, #1B4332 0%, #0F0B08 55%, #080604 100%);
      color: #F7F2EA;
      font-family: system-ui, -apple-system, sans-serif;
      z-index: 9999;
      transition: opacity 0.35s ease;
    }
    #boot-loader.hide {
      opacity: 0;
      pointer-events: none;
    }
    .pitch {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 38%;
      background: linear-gradient(180deg, transparent, rgba(45, 106, 79, 0.15));
      border-top: 1px solid rgba(247, 242, 234, 0.12);
    }
    .ball-wrap {
      position: relative;
      width: 48px;
      height: 48px;
      margin-bottom: 28px;
      animation: bounce 0.9s ease-in-out infinite;
    }
    .ball {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #E53E3E, #B91C1C 55%, #7F1D1D);
      box-shadow: 0 8px 24px rgba(185, 28, 28, 0.45);
    }
    .ball::after {
      content: '';
      position: absolute;
      inset: 12px;
      border: 2px solid rgba(247, 242, 234, 0.55);
      border-radius: 50%;
      transform: rotate(24deg);
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0) scaleX(1.05); }
      50% { transform: translateY(-72px) scaleX(0.92); }
    }
    #boot-loader h1 {
      margin: 0;
      font-size: 0.75rem;
      letter-spacing: 0.35em;
      font-weight: 600;
      color: #D4A574;
    }
    #boot-loader p {
      margin: 10px 0 0;
      color: #9C8B7E;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <div id="boot-loader">
    <div class="pitch"></div>
    <div class="ball-wrap"><div class="ball"></div></div>
    <h1>CRICKRISE</h1>
    <p>Warming up…</p>
  </div>
  <script>
    function hideBootLoader() {
      var el = document.getElementById('boot-loader');
      if (el && !el.classList.contains('hide')) {
        el.classList.add('hide');
        setTimeout(function () { el.remove(); }, 400);
      }
    }
    window.addEventListener('flutter-first-frame', hideBootLoader);
    // Safety: never trap users on HTML loader if Flutter is slow.
    setTimeout(hideBootLoader, 12000);
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
