name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.24.0"

      - name: Stub local secrets for CI
        run: |
          cp lib/config/secrets.local.example.dart lib/config/secrets.local.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Check release secrets (example stub — informational only)
        # CI never has real secrets.local.dart (no appl_ key, no Supabase
        # project), so this check is expected to fail here and is
        # non-blocking. The real gate is tool/upload_testflight.sh, which
        # runs this same script against the developer's real local secrets
        # before every TestFlight build and hard-fails on any violation.
        continue-on-error: true
        run: dart run tool/check_release_secrets.dart

  edge-function:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Test vision-score helpers
        working-directory: supabase/functions/vision-score
        # --allow-read: lib_test asserts quota-before-Gemini order in index.ts
        run: deno test --allow-read lib_test.ts

      - name: Test usage-alert helpers
        working-directory: supabase/functions/usage-alert
        run: deno test lib_test.ts

      - name: Test revenuecat-webhook helpers
        working-directory: supabase/functions/revenuecat-webhook
        run: deno test lib_test.ts
