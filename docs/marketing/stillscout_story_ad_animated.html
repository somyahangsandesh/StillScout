<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>StillScout — Scroll Trap (Instagram Story Ad)</title>
  <!--
    HOW TO RECORD FOR INSTAGRAM STORIES
    -----------------------------------
    1. Open this file in Chrome or Safari. Prefer fullscreen / hide toolbars.
       The ad stage is locked to 1080×1920 (9:16), centered with letterboxing.
    2. Screen-record the stage only:
       • Mac: QuickTime Player → File → New Screen Recording → drag a tight
         rectangle around the 9:16 stage (or record full screen and crop later).
       • iPhone: AirPlay / open the file in Safari → Control Center → Screen Recording.
    3. Export / crop to 1080×1920, H.264 or HEVC. Preview in Instagram drafts
       before posting or boosting. Replay button appears at the end — record one
       clean pass from start (progress bar fills ~14.5s) and cut before Replay.

    Concept: "Scroll Trap" — Hook → scrub problem → StillScout finds the frame → brand + soft CTA.
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --void: #070706;
      --charcoal: #12110f;
      --ink: #1a1814;
      --chalk: #f3efe6;
      --mist: rgba(243, 239, 230, 0.62);
      --gold: #e8c97a;
      --gold-bright: #f0d78a;
      --gold-dim: rgba(232, 201, 122, 0.35);
      --amber: #c9a24a;
      --scrub: #2a2620;
      --duration: 14.5s;
      --safe-top: 12%;
      --safe-bottom: 18%;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: #000;
      color: var(--chalk);
      font-family: "DM Sans", ui-sans-serif, system-ui, -apple-system, sans-serif;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: grid;
      place-items: center;
      background:
        radial-gradient(ellipse 80% 50% at 50% 0%, #1a1610 0%, #000 70%);
    }

    /* 1080×1920 stage, scaled to fit viewport */
    .stage-wrap {
      width: min(100vw, calc(100vh * 9 / 16));
      height: min(100vh, calc(100vw * 16 / 9));
      position: relative;
    }

    .stage {
      position: absolute;
      inset: 0;
      width: 1080px;
      height: 1920px;
      transform-origin: top left;
      overflow: hidden;
      background: var(--void);
      isolation: isolate;
    }

    /* Film atmosphere */
    .grain,
    .vignette,
    .letterbox {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 40;
    }

    .vignette {
      background:
        radial-gradient(ellipse 75% 65% at 50% 45%, transparent 35%, rgba(0, 0, 0, 0.55) 100%),
        linear-gradient(180deg, rgba(0, 0, 0, 0.45) 0%, transparent 14%, transparent 82%, rgba(0, 0, 0, 0.55) 100%);
    }

    .grain {
      opacity: 0.14;
      mix-blend-mode: overlay;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      animation: grainShift 0.4s steps(3) infinite;
    }

    @keyframes grainShift {
      0% { transform: translate(0, 0); }
      33% { transform: translate(-1.5%, 1%); }
      66% { transform: translate(1%, -1.5%); }
      100% { transform: translate(0, 0); }
    }

    /* Progress */
    .progress {
      position: absolute;
      top: 56px;
      left: 48px;
      right: 48px;
      height: 3px;
      z-index: 50;
      border-radius: 999px;
      background: rgba(243, 239, 230, 0.18);
      overflow: hidden;
    }

    .progress > i {
      display: block;
      height: 100%;
      width: 0;
      background: linear-gradient(90deg, var(--gold), var(--gold-bright));
      border-radius: inherit;
      transform-origin: left center;
    }

    .progress.is-playing > i {
      animation: progressFill var(--duration) linear forwards;
    }

    @keyframes progressFill {
      from { width: 0; }
      to { width: 100%; }
    }

    /* Beats */
    .beat {
      position: absolute;
      inset: 0;
      opacity: 0;
      pointer-events: none;
      z-index: 2;
    }

    .stage.is-playing .beat-1 { animation: beatInOut 3.2s ease both; }
    .stage.is-playing .beat-2 { animation: beatInOut 3.8s ease both 3.1s; }
    .stage.is-playing .beat-3 { animation: beatInOut 4s ease both 6.8s; }
    .stage.is-playing .beat-4 { animation: beatEnd 3.8s ease both 10.7s; }

    @keyframes beatInOut {
      0% { opacity: 0; }
      8% { opacity: 1; }
      88% { opacity: 1; }
      100% { opacity: 0; }
    }

    @keyframes beatEnd {
      0% { opacity: 0; }
      10% { opacity: 1; }
      100% { opacity: 1; }
    }

    /* Shared copy layout — middle live area */
    .copy {
      position: absolute;
      left: 72px;
      right: 72px;
      top: 22%;
      bottom: 28%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      z-index: 10;
      gap: 18px;
    }

    .line {
      font-family: "Bebas Neue", "Arial Narrow", Impact, sans-serif;
      font-size: 92px;
      line-height: 0.95;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      color: var(--chalk);
      text-shadow: 0 8px 40px rgba(0, 0, 0, 0.55);
      opacity: 0;
      transform: translateY(28px);
    }

    .line.sub {
      font-size: 64px;
      color: var(--mist);
      letter-spacing: 0.03em;
    }

    .line.gold {
      color: var(--gold);
    }

    .stage.is-playing .beat-1 .line-a {
      animation: typeUp 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.25s forwards;
    }
    .stage.is-playing .beat-2 .line-a {
      animation: typeUp 0.65s cubic-bezier(0.22, 1, 0.36, 1) 3.35s forwards;
    }
    .stage.is-playing .beat-2 .line-b {
      animation: typeUp 0.65s cubic-bezier(0.22, 1, 0.36, 1) 3.75s forwards;
    }
    .stage.is-playing .beat-3 .line-a {
      animation: typeUp 0.7s cubic-bezier(0.22, 1, 0.36, 1) 7.1s forwards;
    }
    .stage.is-playing .beat-3 .line-b {
      animation: typeUp 0.65s cubic-bezier(0.22, 1, 0.36, 1) 7.55s forwards;
    }

    @keyframes typeUp {
      to { opacity: 1; transform: translateY(0); }
    }

    /* ——— Beat 1: filmed it / motion blur strip ——— */
    .film-plane {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(160deg, #2a241c 0%, #0e0d0b 45%, #1c1812 100%);
      overflow: hidden;
    }

    .film-plane::before {
      content: "";
      position: absolute;
      inset: -10%;
      background:
        radial-gradient(circle at 35% 40%, rgba(232, 201, 122, 0.18), transparent 40%),
        radial-gradient(circle at 70% 60%, rgba(120, 90, 40, 0.25), transparent 45%),
        linear-gradient(115deg, transparent 30%, rgba(255, 255, 255, 0.04) 50%, transparent 70%);
      animation: kenBurns 3.2s ease-out both;
    }

    .stage.is-playing .beat-1 .film-plane::before {
      animation: kenBurns 3.2s ease-out both;
    }

    @keyframes kenBurns {
      from { transform: scale(1.12) translate(0, 0); }
      to { transform: scale(1.02) translate(-2%, 1%); }
    }

    .scrub-track {
      position: absolute;
      left: 50%;
      bottom: 26%;
      transform: translateX(-50%);
      width: 78%;
      height: 120px;
      z-index: 5;
      opacity: 0;
    }

    .stage.is-playing .beat-1 .scrub-track {
      animation: fadeIn 0.4s ease 0.4s forwards;
    }

    @keyframes fadeIn {
      to { opacity: 1; }
    }

    .filmstrip {
      display: flex;
      gap: 8px;
      height: 88px;
      overflow: hidden;
      border-radius: 10px;
      border: 1px solid rgba(243, 239, 230, 0.12);
      background: rgba(0, 0, 0, 0.35);
      padding: 6px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
    }

    .filmstrip .cell {
      flex: 0 0 72px;
      border-radius: 6px;
      background:
        linear-gradient(145deg, rgba(232, 201, 122, 0.15), transparent 50%),
        linear-gradient(180deg, #3a342c, #1a1713);
      position: relative;
      overflow: hidden;
    }

    .filmstrip .cell::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.08), transparent);
      transform: translateX(-100%);
    }

    .stage.is-playing .beat-1 .filmstrip {
      animation: scrubSlide 2.4s cubic-bezier(0.4, 0, 0.2, 1) 0.6s both;
    }

    @keyframes scrubSlide {
      from { transform: translateX(18%); filter: blur(0); }
      40% { filter: blur(0.6px); }
      to { transform: translateX(-42%); filter: blur(0); }
    }

    .thumb {
      position: absolute;
      left: 58%;
      top: -8px;
      width: 4px;
      height: 104px;
      background: var(--gold);
      border-radius: 2px;
      box-shadow: 0 0 18px var(--gold-dim);
    }

    .stage.is-playing .beat-1 .thumb {
      animation: thumbScrub 2.4s cubic-bezier(0.4, 0, 0.2, 1) 0.6s both;
    }

    @keyframes thumbScrub {
      from { left: 22%; }
      to { left: 68%; }
    }

    .cell.c1 { background: linear-gradient(160deg, #4a3f32, #1f1a14); }
    .cell.c2 { background: linear-gradient(160deg, #5a4a38, #221c16); }
    .cell.c3 { background: linear-gradient(160deg, #3d4a42, #151a18); }
    .cell.c4 { background: linear-gradient(160deg, #4a3840, #1a1418); }
    .cell.c5 { background: linear-gradient(160deg, #3a4238, #141812); }
    .cell.c6 { background: linear-gradient(160deg, #524638, #1c1812); }
    .cell.c7 { background: linear-gradient(160deg, #2e3a42, #101418); }
    .cell.c8 { background: linear-gradient(160deg, #463a2e, #181410); }
    .cell.c9 { background: linear-gradient(160deg, #3a3228, #12100e); }
    .cell.c10 { background: linear-gradient(160deg, #4e4234, #1e1a14); }

    .sil {
      position: absolute;
      width: 36px;
      height: 48px;
      border-radius: 40% 40% 30% 30%;
      background: rgba(0, 0, 0, 0.35);
      left: 50%;
      top: 55%;
      transform: translate(-50%, -50%);
    }

    .sil::before {
      content: "";
      position: absolute;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.4);
      top: -14px;
      left: 50%;
      transform: translateX(-50%);
    }

    /* ——— Beat 2: lost in scrub ——— */
    .blur-plane {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse at 48% 42%, #3a3228 0%, #12100e 55%, #070706 100%);
    }

    .blur-plane .streaks {
      position: absolute;
      inset: -20%;
      background:
        repeating-linear-gradient(
          95deg,
          transparent 0 14px,
          rgba(243, 239, 230, 0.03) 14px 16px,
          transparent 16px 40px
        );
      filter: blur(8px);
      opacity: 0.7;
    }

    .stage.is-playing .beat-2 .streaks {
      animation: streakRush 3.8s ease-out both;
    }

    @keyframes streakRush {
      from { transform: translateX(-8%) scale(1.1); opacity: 0.4; }
      to { transform: translateX(12%) scale(1); opacity: 0.75; }
    }

    .wrong-frame {
      position: absolute;
      left: 50%;
      top: 52%;
      width: 420px;
      height: 560px;
      transform: translate(-50%, -50%) rotate(-2deg);
      border-radius: 18px;
      border: 2px solid rgba(243, 239, 230, 0.2);
      background:
        radial-gradient(circle at 45% 38%, #4a4034 0%, #1e1a14 60%, #0c0b09 100%);
      box-shadow: 0 40px 100px rgba(0, 0, 0, 0.6);
      overflow: hidden;
      opacity: 0;
    }

    .wrong-frame .face {
      position: absolute;
      width: 140px;
      height: 180px;
      left: 50%;
      top: 42%;
      transform: translate(-50%, -50%);
      border-radius: 50% 50% 45% 45%;
      background: linear-gradient(180deg, #5a4e40, #2a241c);
      filter: blur(3px);
      opacity: 0.85;
    }

    .wrong-frame .face::after {
      content: "";
      position: absolute;
      width: 70px;
      height: 18px;
      background: rgba(0, 0, 0, 0.35);
      border-radius: 8px;
      top: 42%;
      left: 18%;
      transform: rotate(-8deg);
      box-shadow: 40px 4px 0 rgba(0, 0, 0, 0.3);
    }

    .wrong-badge {
      position: absolute;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 13px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(243, 239, 230, 0.45);
      font-weight: 500;
    }

    .stage.is-playing .beat-2 .wrong-frame {
      animation: wrongHold 3.2s cubic-bezier(0.22, 1, 0.36, 1) 3.4s both;
    }

    @keyframes wrongHold {
      0% { opacity: 0; transform: translate(-50%, -46%) scale(1.08) rotate(-2deg); filter: blur(4px); }
      25% { opacity: 1; filter: blur(2px); }
      100% { opacity: 1; transform: translate(-50%, -50%) scale(1) rotate(-1deg); filter: blur(1.5px); }
    }

    /* ——— Beat 3: StillScout finds it ——— */
    .scout-plane {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(180deg, #0c0b09 0%, #16140f 40%, #0a0908 100%);
    }

    .phone {
      position: absolute;
      left: 50%;
      top: 48%;
      width: 520px;
      height: 980px;
      transform: translate(-50%, -50%);
      border-radius: 52px;
      background: #0a0a0a;
      border: 3px solid #2a2620;
      box-shadow:
        0 0 0 1px #3a342c,
        0 50px 120px rgba(0, 0, 0, 0.65),
        inset 0 0 0 1px rgba(255, 255, 255, 0.04);
      overflow: hidden;
      opacity: 0;
    }

    .phone .notch {
      position: absolute;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      width: 140px;
      height: 28px;
      background: #000;
      border-radius: 20px;
      z-index: 5;
    }

    .phone .screen {
      position: absolute;
      inset: 12px;
      border-radius: 42px;
      overflow: hidden;
      background: #12110f;
    }

    .phone .app-bar {
      position: absolute;
      top: 48px;
      left: 28px;
      right: 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 3;
      font-size: 15px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--gold);
      font-weight: 600;
    }

    .phone .scan-line {
      position: absolute;
      left: 0;
      right: 0;
      height: 3px;
      top: 20%;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      box-shadow: 0 0 24px var(--gold-dim);
      opacity: 0;
      z-index: 4;
    }

    .stage.is-playing .beat-3 .phone {
      animation: phoneIn 0.8s cubic-bezier(0.22, 1, 0.36, 1) 7s forwards;
    }

    .stage.is-playing .beat-3 .scan-line {
      animation: scanSweep 1.6s ease-in-out 7.4s both;
    }

    @keyframes phoneIn {
      from { opacity: 0; transform: translate(-50%, -46%) scale(0.94); }
      to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    }

    @keyframes scanSweep {
      0% { opacity: 0; top: 18%; }
      15% { opacity: 1; }
      100% { opacity: 0.3; top: 72%; }
    }

    .picks {
      position: absolute;
      left: 24px;
      right: 24px;
      top: 120px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .pick {
      aspect-ratio: 3 / 4;
      border-radius: 14px;
      background: linear-gradient(160deg, #3a3228, #1a1612);
      border: 1px solid rgba(243, 239, 230, 0.08);
      position: relative;
      overflow: hidden;
      opacity: 0;
      transform: scale(0.92);
    }

    .pick.hero {
      grid-column: 1 / -1;
      aspect-ratio: 16 / 10;
      background:
        radial-gradient(circle at 42% 35%, #6a5840 0%, #2a2218 50%, #14110e 100%);
    }

    .pick .glow-ring {
      position: absolute;
      inset: 0;
      border-radius: inherit;
      box-shadow: inset 0 0 0 0 var(--gold);
    }

    .pick .label {
      position: absolute;
      top: 12px;
      left: 12px;
      font-size: 11px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--gold);
      background: rgba(0, 0, 0, 0.45);
      padding: 6px 10px;
      border-radius: 6px;
      font-weight: 600;
      opacity: 0;
    }

    .stage.is-playing .beat-3 .pick.hero {
      animation: pickReveal 0.7s cubic-bezier(0.22, 1, 0.36, 1) 8.2s forwards,
                 framePulse 1.4s ease-in-out 9s 2;
    }
    .stage.is-playing .beat-3 .pick.p2 {
      animation: pickReveal 0.55s cubic-bezier(0.22, 1, 0.36, 1) 8.55s forwards;
    }
    .stage.is-playing .beat-3 .pick.p3 {
      animation: pickReveal 0.55s cubic-bezier(0.22, 1, 0.36, 1) 8.75s forwards;
    }
    .stage.is-playing .beat-3 .pick.hero .label {
      animation: fadeIn 0.4s ease 8.6s forwards;
    }
    .stage.is-playing .beat-3 .pick.hero .glow-ring {
      animation: ringPulse 1.4s ease-in-out 9s 2;
    }

    @keyframes pickReveal {
      to { opacity: 1; transform: scale(1); }
    }

    @keyframes framePulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.015); }
    }

    @keyframes ringPulse {
      0%, 100% { box-shadow: inset 0 0 0 2px rgba(232, 201, 122, 0.35); }
      50% { box-shadow: inset 0 0 0 3px rgba(232, 201, 122, 0.95), 0 0 28px rgba(232, 201, 122, 0.35); }
    }

    .pick .mini-face {
      position: absolute;
      width: 48%;
      height: 55%;
      left: 26%;
      top: 22%;
      border-radius: 50% 50% 42% 42%;
      background: linear-gradient(180deg, #7a6850, #3a3024);
    }

    .pick.hero .mini-face {
      width: 28%;
      height: 58%;
      left: 36%;
      top: 18%;
      filter: none;
    }

    .pick.p2 { background: linear-gradient(160deg, #2e3a34, #141816); }
    .pick.p3 { background: linear-gradient(160deg, #3a2e34, #161214); }

    .beat-3 .copy {
      top: auto;
      bottom: 22%;
      height: auto;
      justify-content: flex-end;
    }

    /* ——— Beat 4: brand end ——— */
    .end-plane {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 90% 60% at 50% 40%, #1c1812 0%, #0a0908 55%, #050504 100%);
    }

    .end-still {
      position: absolute;
      inset: 0;
      opacity: 0.35;
      background:
        radial-gradient(circle at 50% 38%, #5a4a36 0%, transparent 45%),
        linear-gradient(180deg, #1a1612, #070706);
      transform: scale(1.08);
    }

    .stage.is-playing .beat-4 .end-still {
      animation: kenEnd 3.8s ease-out both;
    }

    @keyframes kenEnd {
      from { transform: scale(1.12); opacity: 0.25; }
      to { transform: scale(1); opacity: 0.4; }
    }

    .brand-lockup {
      position: absolute;
      left: 72px;
      right: 72px;
      top: 28%;
      bottom: 28%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 28px;
      z-index: 10;
    }

    .wordmark {
      font-family: "Bebas Neue", "Arial Narrow", Impact, sans-serif;
      font-size: 128px;
      letter-spacing: 0.08em;
      line-height: 0.9;
      color: var(--chalk);
      opacity: 0;
      transform: translateY(24px);
      text-shadow: 0 10px 50px rgba(0, 0, 0, 0.5);
    }

    .wordmark span {
      color: var(--gold);
    }

    .tag {
      font-size: 28px;
      font-weight: 500;
      letter-spacing: 0.06em;
      color: var(--mist);
      opacity: 0;
      transform: translateY(16px);
    }

    .cta {
      margin-top: 12px;
      font-size: 22px;
      font-weight: 600;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--gold);
      opacity: 0;
      transform: translateY(12px);
      padding: 16px 36px;
      border: 1px solid var(--gold-dim);
      border-radius: 999px;
    }

    .ai-note {
      font-size: 16px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(243, 239, 230, 0.4);
      opacity: 0;
    }

    .stage.is-playing .beat-4 .wordmark {
      animation: typeUp 0.8s cubic-bezier(0.22, 1, 0.36, 1) 10.95s forwards;
    }
    .stage.is-playing .beat-4 .tag {
      animation: typeUp 0.7s cubic-bezier(0.22, 1, 0.36, 1) 11.45s forwards;
    }
    .stage.is-playing .beat-4 .cta {
      animation: typeUp 0.65s cubic-bezier(0.22, 1, 0.36, 1) 11.95s forwards;
    }
    .stage.is-playing .beat-4 .ai-note {
      animation: fadeIn 0.5s ease 12.5s forwards;
    }

    /* Gold accent line under brand */
    .gold-rule {
      width: 72px;
      height: 2px;
      background: var(--gold);
      opacity: 0;
      transform: scaleX(0);
    }

    .stage.is-playing .beat-4 .gold-rule {
      animation: ruleIn 0.5s cubic-bezier(0.22, 1, 0.36, 1) 11.25s forwards;
    }

    @keyframes ruleIn {
      to { opacity: 1; transform: scaleX(1); }
    }

    /* Replay */
    .replay {
      position: absolute;
      left: 50%;
      bottom: 12%;
      transform: translateX(-50%) translateY(12px);
      z-index: 60;
      appearance: none;
      border: 1px solid rgba(232, 201, 122, 0.45);
      background: rgba(10, 9, 8, 0.72);
      color: var(--gold);
      font-family: inherit;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      padding: 18px 40px;
      border-radius: 999px;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      backdrop-filter: blur(8px);
      transition: background 0.2s ease, border-color 0.2s ease;
    }

    .replay:hover {
      background: rgba(232, 201, 122, 0.12);
      border-color: var(--gold);
    }

    .replay.is-visible {
      opacity: 1;
      pointer-events: auto;
      transform: translateX(-50%) translateY(0);
      transition: opacity 0.4s ease, transform 0.4s ease;
    }

    .hint {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 12px;
      letter-spacing: 0.08em;
      color: rgba(243, 239, 230, 0.35);
      z-index: 100;
      pointer-events: none;
      white-space: nowrap;
    }

    @media (max-height: 900px) {
      .hint { display: none; }
    }
  </style>
</head>
<body>
  <p class="hint">1080×1920 stage · screen-record the frame · Replay at end</p>

  <div class="stage-wrap" id="wrap">
    <div class="stage" id="stage" aria-label="StillScout Instagram Story ad">
      <div class="progress" id="progress"><i></i></div>

      <!-- Beat 1: You filmed it -->
      <section class="beat beat-1" aria-hidden="true">
        <div class="film-plane"></div>
        <div class="scrub-track">
          <div class="filmstrip">
            <div class="cell c1"><span class="sil"></span></div>
            <div class="cell c2"><span class="sil"></span></div>
            <div class="cell c3"><span class="sil"></span></div>
            <div class="cell c4"><span class="sil"></span></div>
            <div class="cell c5"><span class="sil"></span></div>
            <div class="cell c6"><span class="sil"></span></div>
            <div class="cell c7"><span class="sil"></span></div>
            <div class="cell c8"><span class="sil"></span></div>
            <div class="cell c9"><span class="sil"></span></div>
            <div class="cell c10"><span class="sil"></span></div>
          </div>
          <div class="thumb"></div>
        </div>
        <div class="copy">
          <p class="line line-a">You filmed it.</p>
        </div>
      </section>

      <!-- Beat 2: Lost in the scrub -->
      <section class="beat beat-2" aria-hidden="true">
        <div class="blur-plane"><div class="streaks"></div></div>
        <div class="wrong-frame">
          <div class="face"></div>
          <span class="wrong-badge">Wrong frame</span>
        </div>
        <div class="copy">
          <p class="line line-a sub">Then you lost it</p>
          <p class="line line-b">in the scrub.</p>
        </div>
      </section>

      <!-- Beat 3: StillScout finds the still -->
      <section class="beat beat-3" aria-hidden="true">
        <div class="scout-plane"></div>
        <div class="phone">
          <div class="notch"></div>
          <div class="screen">
            <div class="app-bar"><span>StillScout</span><span>AI</span></div>
            <div class="scan-line"></div>
            <div class="picks">
              <div class="pick hero">
                <div class="mini-face"></div>
                <div class="glow-ring"></div>
                <span class="label">Top pick</span>
              </div>
              <div class="pick p2"><div class="mini-face"></div></div>
              <div class="pick p3"><div class="mini-face"></div></div>
            </div>
          </div>
        </div>
        <div class="copy">
          <p class="line line-a gold">StillScout</p>
          <p class="line line-b sub" style="font-size:52px">finds the still.</p>
        </div>
      </section>

      <!-- Beat 4: Brand + CTA -->
      <section class="beat beat-4" aria-hidden="true">
        <div class="end-plane"></div>
        <div class="end-still"></div>
        <div class="brand-lockup">
          <p class="wordmark">STILL<span>SCOUT</span></p>
          <div class="gold-rule"></div>
          <p class="tag">Scout. Polish. Post.</p>
          <p class="cta">Link in bio</p>
          <p class="ai-note">Coming soon · StillScout AI</p>
        </div>
      </section>

      <div class="vignette"></div>
      <div class="grain"></div>

      <button type="button" class="replay" id="replay">Replay</button>
    </div>
  </div>

  <script>
    (function () {
      var wrap = document.getElementById("wrap");
      var stage = document.getElementById("stage");
      var progress = document.getElementById("progress");
      var replay = document.getElementById("replay");
      var DURATION = 14500;
      var timer = null;

      function fit() {
        var scale = Math.min(wrap.clientWidth / 1080, wrap.clientHeight / 1920);
        stage.style.transform = "scale(" + scale + ")";
      }

      function restartAnimations(el) {
        el.querySelectorAll("*").forEach(function (node) {
          node.style.animation = "none";
        });
        // Force reflow
        void el.offsetWidth;
        el.querySelectorAll("*").forEach(function (node) {
          node.style.animation = "";
        });
      }

      function play() {
        clearTimeout(timer);
        replay.classList.remove("is-visible");
        progress.classList.remove("is-playing");
        stage.classList.remove("is-playing");
        restartAnimations(stage);
        restartAnimations(progress);
        // Restart
        requestAnimationFrame(function () {
          stage.classList.add("is-playing");
          progress.classList.add("is-playing");
          timer = setTimeout(function () {
            replay.classList.add("is-visible");
          }, DURATION);
        });
      }

      window.addEventListener("resize", fit);
      replay.addEventListener("click", play);
      fit();
      play();
    })();
  </script>
</body>
</html>
